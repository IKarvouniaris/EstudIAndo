<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>estudIAndo — Prueba de login (Fase 0)</title>
<style>
  body{font-family:system-ui,sans-serif; max-width:36rem; margin:3rem auto; padding:0 1.5rem; line-height:1.6}
  button{font:inherit; padding:.6rem 1rem; margin:.3rem .3rem .3rem 0; cursor:pointer}
  input{font:inherit; padding:.5rem; width:16rem}
  #estado{margin-top:1.5rem; padding:1rem; background:#f2f2f2; border-radius:6px; white-space:pre-wrap}
  .oculto{display:none}
</style>
</head>
<body>
<h1>Prueba de login — Fase 0</h1>
<p>Esta página es temporal: sólo sirve para validar que Google OAuth y el magic link funcionan antes de integrarlos en el sitio real.</p>

<div id="zona-anonima">
  <button id="btn-google">Entrar con Google</button>
  <div>
    <input id="input-email" type="email" placeholder="tu@email.com">
    <button id="btn-magic">Mandame un link</button>
  </div>
</div>

<div id="zona-logueada" class="oculto">
  <p>Sesión activa como: <b id="email-actual"></b></p>
  <button id="btn-salir">Salir</button>
</div>

<pre id="estado"></pre>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  var elEstado = document.getElementById("estado");
  var elAnonima = document.getElementById("zona-anonima");
  var elLogueada = document.getElementById("zona-logueada");
  var elEmail = document.getElementById("email-actual");

  function log(msg) { elEstado.textContent = msg; console.log(msg); }
  function pintar(sesion) {
    if (sesion) {
      elAnonima.classList.add("oculto");
      elLogueada.classList.remove("oculto");
      elEmail.textContent = sesion.user.email;
    } else {
      elAnonima.classList.remove("oculto");
      elLogueada.classList.add("oculto");
    }
  }

  document.getElementById("btn-google").addEventListener("click", function () {
    Auth.entrarConGoogle().then(function (r) {
      if (r.error) log("Error Google: " + r.error.message);
    });
  });

  document.getElementById("btn-magic").addEventListener("click", function () {
    var email = document.getElementById("input-email").value.trim();
    if (!email) { log("Escribí un email primero."); return; }
    Auth.enviarMagicLink(email).then(function (r) {
      log(r.error ? "Error magic link: " + r.error.message : "Listo, revisá tu email: " + email);
    });
  });

  document.getElementById("btn-salir").addEventListener("click", function () {
    Auth.salir().then(function () { log("Sesión cerrada."); });
  });

  Auth.onCambioSesion(pintar);
  Auth.obtenerSesion().then(pintar);
})();
</script>
</body>
</html>
