<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAgram — estudIAndo</title>
<style>
:root{
  color-scheme: light;
  --papel:#EDEEE9; --papel-2:#F8F9F6; --papel-3:#E3E5DE;
  --tinta:#15181A; --tinta-2:#545B60; --tinta-3:#7B8288;
  --linea:#C7CAC2; --linea-2:#D9DBD4;
  --u1:#2E3A94; --u2:#9A5A12; --u3:#1B6A5B; --u4:#6D3470;
  --u1-suave:#E2E5F6; --u2-suave:#F4E7D2; --u3-suave:#DCEDE8; --u4-suave:#F0E3F0;
  --display:"Bahnschrift","Franklin Gothic Medium","Arial Narrow","Helvetica Neue",sans-serif;
  --body:"Sitka Text","Constantia",Georgia,"Times New Roman",serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",ui-monospace,monospace;
}
:root[data-tema="oscuro"]{
  color-scheme: dark;
  --papel:#101315; --papel-2:#181C20; --papel-3:#1F2429;
  --tinta:#E9EBE6; --tinta-2:#A2AAB0; --tinta-3:#7C858B;
  --linea:#2B3238; --linea-2:#232930;
  --u1:#909EF0; --u2:#E2A95B; --u3:#4FC7AC; --u4:#D39AD6;
  --u1-suave:#1B2040; --u2-suave:#35270F; --u3-suave:#10302B; --u4-suave:#2E1830;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
body{margin:0; background:var(--papel-3); color:var(--tinta); font-family:var(--body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--u1); outline-offset:2px}
a{color:inherit; text-decoration:none}

.telefono{max-width:470px; margin:0 auto; min-height:100vh; background:var(--papel); border-left:1px solid var(--linea); border-right:1px solid var(--linea); display:flex; flex-direction:column}

.barra-superior{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.8rem 1rem; background:var(--papel-2); border-bottom:1px solid var(--linea)}
.barra-superior .logo{font-family:var(--display); font-weight:700; font-size:1.1rem}
.barra-superior .acciones{display:flex; align-items:center; gap:.5rem}
.barra-superior a, .barra-superior button{font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; padding:.4rem .6rem; background:var(--papel-3); color:var(--tinta-2); border:1px solid var(--linea); border-radius:2px; cursor:pointer}
.barra-superior button:hover, .barra-superior a:hover{color:var(--tinta); border-color:var(--tinta-3)}

main.contenido{flex:1; padding-bottom:4.5rem}
.vista[hidden]{display:none}

.barra-inferior{position:sticky; bottom:0; z-index:5; display:flex; justify-content:space-around; padding:.7rem 0; background:var(--papel-2); border-top:1px solid var(--linea)}
.barra-inferior a{font-family:var(--mono); font-size:.62rem; letter-spacing:.05em; color:var(--tinta-2)}
.barra-inferior a:hover{color:var(--tinta)}

.grilla-perfiles{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--linea); padding:1px}
.tarjeta-perfil{display:flex; flex-direction:column; align-items:center; gap:.4rem; background:var(--papel); padding:1.6rem 1rem; text-align:center}
.tarjeta-perfil.proximamente{opacity:.55; cursor:default}
.avatar-perfil{width:3.4rem; height:3.4rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:1.3rem; color:var(--papel-2)}
.avatar-perfil[data-u="1"]{background:var(--u1)}
.avatar-perfil[data-u="2"]{background:var(--u2)}
.avatar-perfil[data-u="3"]{background:var(--u3)}
.avatar-perfil[data-u="4"]{background:var(--u4)}
.nombre-perfil{font-family:var(--display); font-weight:700; font-size:.92rem}
.usuario-perfil{font-family:var(--mono); font-size:.68rem; color:var(--tinta-3)}
.contador-perfil{font-family:var(--mono); font-size:.62rem; color:var(--tinta-2)}
.badge-proximamente{font-family:var(--mono); font-size:.6rem; letter-spacing:.06em; color:var(--tinta-3); border:1px solid var(--linea); border-radius:2px; padding:.2rem .5rem}

.perfil-header{display:flex; flex-direction:column; align-items:center; gap:.5rem; padding:1.8rem 1.2rem; border-bottom:1px solid var(--linea); text-align:center}
.perfil-avatar{width:5rem; height:5rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:2rem; color:var(--papel-2)}
.perfil-avatar[data-u="1"]{background:var(--u1)}
.perfil-avatar[data-u="2"]{background:var(--u2)}
.perfil-avatar[data-u="3"]{background:var(--u3)}
.perfil-avatar[data-u="4"]{background:var(--u4)}
#perfil-nombre{font-family:var(--display); font-weight:700; font-size:1.2rem; margin:0}
#perfil-usuario{font-family:var(--mono); font-size:.72rem; color:var(--tinta-3); margin:0}
#perfil-bio{font-size:.88rem; color:var(--tinta-2); max-width:32ch; margin:0 auto}
#perfil-stats{font-family:var(--mono); font-size:.68rem; color:var(--tinta-2); margin:0}
.feed{display:flex; flex-direction:column}

.post{border-bottom:1px solid var(--linea); padding-bottom:1rem}
.post-header{display:flex; align-items:center; gap:.5rem; padding:.7rem 1rem}
.post-avatar{width:1.8rem; height:1.8rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:.8rem; color:var(--papel-2)}
.post-avatar[data-u="1"]{background:var(--u1)}
.post-avatar[data-u="2"]{background:var(--u2)}
.post-avatar[data-u="3"]{background:var(--u3)}
.post-avatar[data-u="4"]{background:var(--u4)}
.post-usuario{font-family:var(--display); font-weight:700; font-size:.82rem}
.post-clase{margin-left:auto; font-family:var(--mono); font-size:.64rem; color:var(--tinta-3)}
.post-tarjeta{position:relative; margin:0 1rem; aspect-ratio:1/1; border-radius:4px; display:flex; align-items:center; padding:1.6rem; background:var(--papel-3)}
.post-tarjeta[data-u="1"]{background:var(--u1-suave)}
.post-tarjeta[data-u="2"]{background:var(--u2-suave)}
.post-tarjeta[data-u="3"]{background:var(--u3-suave)}
.post-tarjeta[data-u="4"]{background:var(--u4-suave)}
.post-tarjeta-titulo{font-family:var(--display); font-weight:700; font-size:clamp(1.3rem,5vw,1.7rem); line-height:1.15; margin:0}
.post-badge{position:absolute; top:.8rem; left:.8rem; font-family:var(--mono); font-size:.62rem; letter-spacing:.04em; background:var(--tinta); color:var(--papel-2); padding:.25rem .55rem; border-radius:2px}
.post-trampa .post-badge{background:var(--u2)}
.post-parcial .post-badge{background:var(--u3)}
.post-caption{padding:.8rem 1rem 0}
.post-caption p{margin:0 0 .5rem; font-size:.88rem; color:var(--tinta)}
.post-hashtags{font-family:var(--mono); font-size:.7rem; color:var(--u1)}
.post-link{display:inline-block; margin-top:.2rem; font-family:var(--mono); font-size:.68rem; color:var(--tinta-2); border-bottom:1px solid var(--linea)}
.post-link:hover{color:var(--tinta); border-color:var(--tinta-3)}
</style>
</head>
<body>
<div class="telefono">
  <header class="barra-superior">
    <a href="#" class="logo" id="link-inicio-superior">IAgram</a>
    <div class="acciones">
      <button class="btn-tema" id="btn-tema" type="button">MODO OSCURO</button>
      <a href="index.html">estudIAndo →</a>
    </div>
  </header>

  <main class="contenido">
    <section id="vista-explorar" class="vista">
      <div class="grilla-perfiles" id="grilla-perfiles"></div>
    </section>

    <section id="vista-perfil" class="vista" hidden>
      <div class="perfil-header">
        <span class="perfil-avatar"></span>
        <h2 id="perfil-nombre"></h2>
        <p id="perfil-usuario"></p>
        <p id="perfil-bio"></p>
        <p id="perfil-stats"></p>
      </div>
      <div class="feed" id="feed"></div>
    </section>
  </main>

  <nav class="barra-inferior">
    <a href="#" id="link-inicio-inferior">Inicio</a>
    <a href="index.html">Salir</a>
  </nav>
</div>

<script>
(function(){
  "use strict";

  // ===== TEMA (mismo patrón y misma clave de localStorage que el resto del sitio) =====
  var raiz = document.documentElement, btnTema = document.getElementById("btn-tema");
  function aplicarTema(t){
    raiz.setAttribute("data-tema", t);
    btnTema.textContent = t === "oscuro" ? "MODO CLARO" : "MODO OSCURO";
    try{ localStorage.setItem("ia-tema", t); }catch(e){}
  }
  var temaGuardado = null;
  try{ temaGuardado = localStorage.getItem("ia-tema"); }catch(e){}
  if(!temaGuardado) temaGuardado = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "oscuro" : "claro";
  aplicarTema(temaGuardado);
  btnTema.addEventListener("click", function(){
    aplicarTema(raiz.getAttribute("data-tema") === "oscuro" ? "claro" : "oscuro");
  });

  // ===== DATOS: PERFILES Y POSTS =====
  var PERFILES = {
    etica: {
      nombre: "Ética en la IA",
      usuario: "@etica.ia",
      bio: "Lo que el parcial de Ética puede preguntar, clase por clase.",
      unidad: 4,
      apunte: "etica.html",
      estado: "activo",
      clases: 7
    },
    "ia-conceptual": {
      nombre: "Introducción a la IA",
      usuario: "@ia.conceptual",
      bio: "Próximamente: los conceptos clave de cada clase.",
      unidad: 1,
      apunte: "ia-conceptual.html",
      estado: "proximamente",
      clases: 0
    },
    python: {
      nombre: "Python para Ciencia de Datos",
      usuario: "@python.ds",
      bio: "Próximamente: los conceptos clave de cada clase.",
      unidad: 3,
      apunte: "python.html",
      estado: "proximamente",
      clases: 0
    },
    estadistica: {
      nombre: "Probabilidad y Estadística",
      usuario: "@estadistica",
      bio: "Próximamente: los conceptos clave de cada clase.",
      unidad: 2,
      apunte: "estadistica.html",
      estado: "proximamente",
      clases: 0
    }
  };

  function badgeDePost(tipo){
    if(tipo === "trampa") return "⚠ Error típico";
    if(tipo === "caso") return "📌 Caso real";
    if(tipo === "parcial") return "★ Para el parcial";
    return "";
  }

  function crearPost(perfilId, post){
    var perfil = PERFILES[perfilId];
    var badge = badgeDePost(post.tipo);
    var art = document.createElement("article");
    art.className = "post post-" + post.tipo;
    art.innerHTML =
      '<header class="post-header">' +
        '<span class="post-avatar" data-u="' + perfil.unidad + '">' + perfil.nombre.charAt(0) + '</span>' +
        '<span class="post-usuario">' + perfil.usuario + '</span>' +
        '<span class="post-clase">Clase ' + post.clase + '</span>' +
      '</header>' +
      '<div class="post-tarjeta" data-u="' + perfil.unidad + '">' +
        (badge ? '<span class="post-badge">' + badge + '</span>' : '') +
        '<p class="post-tarjeta-titulo">' + post.titulo + '</p>' +
      '</div>' +
      '<div class="post-caption">' +
        '<p>' + post.caption + '</p>' +
        '<p class="post-hashtags">' + post.hashtags.map(function(h){ return '#' + h; }).join(' ') + '</p>' +
        '<a class="post-link" href="' + post.href + '">Ver en el apunte →</a>' +
      '</div>';
    return art;
  }

  var POSTS = {};

  var POSTS_ETICA_C1 = [
    {
      tipo: "concepto",
      clase: 1,
      titulo: "¿Qué persona querés ser?",
      caption: "La ética de la virtud no pregunta qué regla seguir, sino qué haría alguien íntegro. Aristóteles la resume en el justo medio: ni por exceso ni por defecto. Si tu modelo tiene sesgos, la pregunta no es \"hay una norma que lo prohíba\", es \"qué haría un/a científico/a de datos honesto/a\": notificarlo, documentarlo, corregirlo.",
      hashtags: ["EticaDeLaVirtud", "Aristoteles", "Bloque1", "ParaElParcial"],
      href: "etica.html#c1"
    },
    {
      tipo: "trampa",
      clase: 1,
      titulo: "No es lo mismo",
      caption: "Trampa clásica de parcial: confundir virtud con deontología. La deontología mira la regla (\"¿qué deber tengo?\"); la virtud mira el carácter (\"¿qué haría alguien íntegro, aunque no exista una norma que lo obligue?\"). Son preguntas distintas aunque a veces lleguen a la misma acción.",
      hashtags: ["Trampa", "Deontologia", "EticaDeLaVirtud"],
      href: "etica.html#c1"
    },
    {
      tipo: "caso",
      clase: 1,
      titulo: "La alucinación que se volvió demanda",
      caption: "ChatGPT inventó que un locutor había cometido fraude, citando una demanda real que nunca decía eso. El afectado demandó a OpenAI por difamación. El fallo dejó una idea incómoda: si hay advertencias claras, el deber de verificar puede recaer en quien usa la herramienta, no en quien la crea. La cátedra es tajante: no existe una responsabilidad \"compartida\" real.",
      hashtags: ["Alucinaciones", "OpenAI", "CasoReal", "Bloque1"],
      href: "etica.html#c1"
    }
  ];

  var POSTS_ETICA_C2 = [
    {
      tipo: "concepto",
      clase: 2,
      titulo: "Elegir un número es elegir un error",
      caption: "El modelo tira un score; alguien decide desde qué valor se actúa. Ese umbral no es un detalle técnico: es una decisión sobre qué error preferís cometer. Umbral alto en detección de fraude significa que se cuela más fraude; umbral bajo significa más gente inocente bloqueada.",
      hashtags: ["Threshold", "FalsosPositivos", "Bloque2", "ParaElParcial"],
      href: "etica.html#c2"
    },
    {
      tipo: "trampa",
      clase: 2,
      titulo: "No es un ajuste técnico",
      caption: "Tratar el threshold como si fuera un simple parámetro de sistema es el error típico. En realidad es una decisión ética: define qué errores tolerás y sobre quién caen. Quien elige el número, elige a quién perjudica.",
      hashtags: ["Trampa", "Threshold", "DecisionesEticas"],
      href: "etica.html#c2"
    },
    {
      tipo: "caso",
      clase: 2,
      titulo: "Pedir el código, no solo el resultado",
      caption: "BOSCO decidía automáticamente quién accedía al Bono Social Eléctrico en España. Durante años, la Justicia negó el acceso al código por \"propiedad intelectual\". En 2025 el Tribunal Supremo dio vuelta el criterio: si un algoritmo decide sobre derechos sociales, la transparencia no termina en el resultado, también alcanza a la lógica de la herramienta.",
      hashtags: ["Transparencia", "BOSCO", "CasoReal", "Bloque2"],
      href: "etica.html#c2"
    }
  ];

  var POSTS_ETICA_C3 = [
    {
      tipo: "concepto",
      clase: 3,
      titulo: "Dos roles, dos responsabilidades",
      caption: "El AI Act reparte la responsabilidad en toda la cadena, no solo en quien programó. Provider: desarrolla el sistema y lo pone en el mercado bajo su nombre. Deployer: lo usa bajo su propia autoridad para un fin concreto. Una empresa de software de selección es provider; el banco que lo compra y lo usa es deployer.",
      hashtags: ["ProviderDeployer", "AIAct", "Bloque2", "ParaElParcial"],
      href: "etica.html#c3"
    },
    {
      tipo: "trampa",
      clase: 3,
      titulo: "Ojo con esta lectura",
      caption: "\"Riesgo mínimo\" no significa \"sin regulación\": solo significa que no hay obligaciones específicas del AI Act para ese caso. Sigue habiendo otras normas aplicables, como protección de datos o defensa del consumidor.",
      hashtags: ["Trampa", "AIAct", "NivelesDeRiesgo"],
      href: "etica.html#c3"
    },
    {
      tipo: "caso",
      clase: 3,
      titulo: "El Uber que no frenó",
      caption: "El sistema detectó el obstáculo 6 segundos antes del choque y lo clasificó mal; reconoció que había que frenar 1,3 segundos antes, pero Uber había desactivado el frenado automático para evitar falsas alarmas. La conductora de seguridad miraba el celular. La única condenada fue ella: el eslabón más débil de la cadena cargó con la responsabilidad.",
      hashtags: ["ResponsabilidadDesplazada", "Uber", "CasoReal", "Bloque2"],
      href: "etica.html#c3"
    }
  ];

  POSTS.etica = [].concat(POSTS_ETICA_C1, POSTS_ETICA_C2, POSTS_ETICA_C3);

  // ===== VISTAS =====
  function mostrarVista(nombre){
    document.querySelectorAll(".vista").forEach(function(v){
      v.hidden = (v.id !== "vista-" + nombre);
    });
  }

  function renderExplorar(){
    var grilla = document.getElementById("grilla-perfiles");
    grilla.innerHTML = "";
    Object.keys(PERFILES).forEach(function(id){
      var perfil = PERFILES[id];
      var activo = perfil.estado === "activo";
      var nodo = document.createElement(activo ? "a" : "div");
      nodo.className = "tarjeta-perfil" + (activo ? "" : " proximamente");
      if(activo) nodo.href = "#perfil=" + id;
      var totalPosts = (POSTS[id] || []).length;
      nodo.innerHTML =
        '<span class="avatar-perfil" data-u="' + perfil.unidad + '">' + perfil.nombre.charAt(0) + '</span>' +
        '<span class="nombre-perfil">' + perfil.nombre + '</span>' +
        '<span class="usuario-perfil">' + perfil.usuario + '</span>' +
        (activo
          ? '<span class="contador-perfil">' + totalPosts + ' posts</span>'
          : '<span class="badge-proximamente">Próximamente</span>');
      grilla.appendChild(nodo);
    });
  }

  function renderPerfil(id){
    var perfil = PERFILES[id];
    var avatar = document.querySelector(".perfil-avatar");
    avatar.setAttribute("data-u", perfil.unidad);
    avatar.textContent = perfil.nombre.charAt(0);
    document.getElementById("perfil-nombre").textContent = perfil.nombre;
    document.getElementById("perfil-usuario").textContent = perfil.usuario;
    document.getElementById("perfil-bio").textContent = perfil.bio;
    var posts = POSTS[id] || [];
    document.getElementById("perfil-stats").textContent = perfil.clases + " clases · " + posts.length + " posts";
    var feed = document.getElementById("feed");
    feed.innerHTML = "";
    posts.forEach(function(post){ feed.appendChild(crearPost(id, post)); });
    mostrarVista("perfil");
  }

  // ===== ROUTER =====
  function manejarHash(){
    var hash = location.hash.replace("#", "");
    if(hash.indexOf("perfil=") === 0){
      var id = hash.slice("perfil=".length);
      if(PERFILES[id] && PERFILES[id].estado === "activo"){ renderPerfil(id); return; }
    }
    mostrarVista("explorar");
  }
  window.addEventListener("hashchange", manejarHash);

  // ===== INICIO =====
  renderExplorar();
  manejarHash();
})();
</script>
</body>
</html>
