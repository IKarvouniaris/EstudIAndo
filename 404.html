*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){ *{animation:none !important} }
body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; background:var(--papel); color:var(--tinta); font-family:var(--body); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}

.cintillo{margin:0 0 .4rem; font-family:var(--mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-3)}
h1{margin:0 0 .6rem; font-family:var(--display); font-weight:700; font-size:clamp(2.6rem,10vw,4.2rem); line-height:1.02; letter-spacing:-.01em}
p{margin:0 0 1.4rem; color:var(--tinta-2)}
.acciones{display:flex; flex-wrap:wrap; justify-content:center; gap:.6rem}
.acciones a{font-family:var(--display); font-size:.95rem; font-weight:600; text-decoration:none; padding:.6rem 1.1rem; border:1px solid var(--tinta); border-radius:2px; background:var(--tinta); color:var(--papel)}
.acciones a.sec{background:transparent; color:var(--tinta)}
.acciones a:hover{opacity:.88}
:focus-visible{outline:2px solid var(--u5); outline-offset:2px}
.pie{margin-top:2.2rem; font-family:var(--mono); font-size:.68rem; color:var(--tinta-3)}
</style>
<script>

(function(){
  var t = null; try{ t = localStorage.getItem("ia-tema"); }catch(e){}

  document.documentElement.setAttribute("data-tema", t);
})();
